---
layout: default
---
<h1>{{ page.title }}</h1>
{{ content }}
{% assign posts = site.categories[page.category] %}
{% if posts %}<ul>{% for p in posts %}<li><a href="{{ p.url }}">{{ p.title }}</a> — {{ p.date | date: "%Y-%m-%d" }}</li>{% endfor %}</ul>{% else %}<p><em>No articles yet.</em></p>{% endif %}
